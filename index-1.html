const GRADS = {
  b:`linear-gradient(135deg,${BL},#42A5F5)`,
  r:`linear-gradient(135deg,${RD},#EF5350)`,
  g:`linear-gradient(135deg,${GR},#66BB6A)`,
  o:`linear-gradient(135deg,${OR},#FFA726)`,
  p:`linear-gradient(135deg,${PU},#CE93D8)`,
  y:`linear-gradient(135deg,#F9A825,${YL})`,
};

function CL({items,val,onChange}){
  const t=x=>onChange(val.includes(x)?val.filter(v=>v!==x):[...val,x]);
  return <div className="cg">{items.map(x=>(
    <label key={x} className={`ci${val.includes(x)?" on":""}`}>
      <input type="checkbox" checked={val.includes(x)} onChange={()=>t(x)}/>{x}
    </label>
  ))}</div>;
}
function RG({items,val,onChange}){
  return <div className="rg">{items.map(x=>(
    <label key={x} className={`ri${val===x?" on":""}`}>
      <input type="radio" checked={val===x} onChange={()=>onChange(x)}/>{x}
    </label>
  ))}</div>;
}
function SH({n,grad,title}){
  return <>
    <div className="sh"><div className="sn" style={{background:grad}}>{n}</div><h2>{title}</h2></div>
    <div className="dv" style={{background:grad}}/>
  </>;
}
function calcPct(f){
  const c=[f.nome.trim(),f.segmentos.length,f.atividades.length,
    f.personagens.length,f.frequencia,f.momentos.length,f.recursos.length,
    f.paee,f.adaptacoes.length,f.confianca];
  return Math.round(c.filter(Boolean).length/c.length*100);
}

function Formulario({onSave}){
  const [f,setF]=useState(emptyForm());
  const [sent,setSent]=useState(false);
  const [err,setErr]=useState("");
  const s=(k,v)=>setF(p=>({...p,[k]:v}));
  const pct=calcPct(f);

  const validate=()=>{
    if(!f.nome.trim()) return "Informe seu nome completo.";
    if(!f.segmentos.length) return "Selecione pelo menos um segmento de atuação.";
    if(!f.atividades.length) return "Selecione pelo menos uma atividade.";
    if(!f.personagens.length) return "Selecione pelo menos um personagem.";
    if(!f.frequencia) return "Informe a frequência das atividades.";
    if(!f.momentos.length) return "Selecione pelo menos um momento da rotina.";
    if(!f.recursos.length) return "Selecione pelo menos um recurso necessário.";
    if(!f.paee) return "Responda sobre alunos com deficiência em sua turma.";
    if(!f.adaptacoes.length) return "Selecione pelo menos uma estratégia.";
    if(!f.confianca) return "Informe seu nível de confiança (1 a 5).";
    return "";
  };

  const submit=()=>{
    const e=validate();
    if(e){setErr(e);window.scrollTo(0,0);return;}
    setErr("");
    const entry={...f,id:Date.now(),data:new Date().toLocaleString("pt-BR")};
    onSave(entry);
    setSent(true);
  };

  if(sent) return(
    <div className="wrap">
      <div className="ok-box">
        <div style={{fontSize:"3rem"}}>🎉</div>
        <h3>Planejamento enviado com sucesso!</h3>
        <p>Obrigado, <strong>{f.nome.split(" ")[0]}</strong>! Suas respostas foram salvas e já estão disponíveis para a equipe de orientação pedagógica.</p>
        <button className="btn-new" onClick={()=>{setF(emptyForm());setSent(false);}}>Preencher novo formulário</button>
      </div>
    </div>
  );

  return(
    <div className="wrap">
      <div className="info-box">
        <strong>📋 Orientação Geral:</strong> Preencha com atenção. As respostas auxiliarão a equipe de orientação pedagógica a organizar recursos e apoios para o projeto anual. Campos com <span style={{color:RD}}>*</span> são obrigatórios.
      </div>
      <div className="pbar-wrap">
        <div className="pbar-label">Preenchimento: {pct}%</div>
        <div className="pbar"><div className="pfill" style={{width:`${pct}%`}}/></div>
      </div>
      {err&&<div className="err-box">⚠️ {err}</div>}

      <SH n="1" grad={GRADS.b} title="Identificação do Professor"/>
      <div className="card">
        <div className="ql">Nome completo <span className="r">*</span></div>
        <input type="text" value={f.nome} onChange={e=>s("nome",e.target.value)} placeholder="Digite seu nome completo..."/>
      </div>
      <div className="card">
        <div className="ql">Em qual(is) segmento(s) você atua? <span className="r">*</span></div>
        <div className="hint">Selecione todas as opções que se aplicam à sua realidade neste ano letivo.</div>
        <CL items={["🧸 Educação Infantil (Creche e Pré-Escola)","📖 1.º Segmento do EF (1.º ao 5.º ano)","🌟 AEE / Sala de Recursos","💛 Classe Especial"]} val={f.segmentos} onChange={v=>s("segmentos",v)}/>
      </div>

      <SH n="2" grad={GRADS.r} title="Atividades Relacionadas ao Projeto"/>
      <div className="card">
        <div className="ql">Quais atividades você pretende desenvolver e em qual bimestre? <span className="r">*</span></div>
        <div className="hint">💡 <b>Dica:</b> Selecione cada atividade e indique em qual(is) bimestre(s) ela será realizada. Um mesmo gibi pode gerar atividades diferentes para cada segmento! Para a EI: contação e dramatização. Para o EF1: produção textual e leitura. Para AEE/CE: sequência narrativa visual e CAA.</div>
        {ATIVIDADES.map(atv=>(
          <div key={atv} style={{border:"1.5px solid #E0E0E0",borderRadius:10,padding:"10px 12px",marginBottom:8,background:f.atividades.includes(atv)?"#EEF4FF":"#fff"}}>
            <label className="ci" style={{border:"none",padding:0,marginBottom:f.atividades.includes(atv)?8:0}}>
              <input type="checkbox" checked={f.atividades.includes(atv)}
                onChange={()=>{
                  const next=f.atividades.includes(atv)?f.atividades.filter(x=>x!==atv):[...f.atividades,atv];
                  const bims={...f.atividadesBimestres};
                  if(!next.includes(atv)) delete bims[atv];
                  s("atividades",next);
                  s("atividadesBimestres",bims);
                }}/>{atv}
            </label>
            {f.atividades.includes(atv)&&(
              <div style={{paddingLeft:26,marginTop:4}}>
                <div style={{fontSize:".78rem",fontWeight:700,color:"#5C5C7A",marginBottom:4}}>📅 Em qual(is) bimestre(s) esta atividade será realizada?</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                  {["1.º Bimestre","2.º Bimestre","3.º Bimestre","4.º Bimestre"].map(bim=>{
                    const sel=(f.atividadesBimestres[atv]||[]).includes(bim);
                    return(
                      <button key={bim} onClick={()=>{
                        const atual=f.atividadesBimestres[atv]||[];
                        const novos=sel?atual.filter(b=>b!==bim):[...atual,bim];
                        s("atividadesBimestres",{...f.atividadesBimestres,[atv]:novos});
                      }} style={{padding:"4px 10px",borderRadius:8,border:`1.5px solid ${sel?"#1565C0":"#D0D0E0"}`,background:sel?"#1565C0":"#fff",color:sel?"#fff":"#5C5C7A",fontSize:".76rem",fontWeight:700,cursor:"pointer"}}>
                        {bim}
                      </button>
                    );
                  })}
                </div>
              </div>
            )}
          </div>
        ))}
      </div>
      <div className="card">
        <div className="ql">Outra atividade não listada? Descreva brevemente:</div>
        <textarea value={f.outraAtividade} onChange={e=>s("outraAtividade",e.target.value)} placeholder="Descreva aqui..."/>
      </div>
      <div className="card">
        <div className="ql">Quais personagens serão o fio condutor? <span className="r">*</span></div>
        <div className="hint">💡 <b>Mônica/Cebolinha</b> → convivência e letramento. <b>Magali</b> → alimentação e ciências. <b>Cascão</b> → higiene e sustentabilidade. <b>Anjinho, Jotalhão, Jeremias</b> → diversidade étnico-cultural.</div>
        <CL items={PERSONAGENS} val={f.personagens} onChange={v=>s("personagens",v)}/>
      </div>

      <SH n="3" grad={GRADS.g} title="Quando as Atividades Serão Realizadas"/>
      <div className="card">
        <div className="ql">Com que frequência? <span className="r">*</span></div>
        <div className="hint">💡 Atividades integradas a outras disciplinas também contam!</div>
        <RG items={["Diariamente (projeto integrado à rotina)","2 a 3 vezes por semana","1 vez por semana","Quinzenalmente","Em momentos pontuais (datas, eventos, mostras)"]} val={f.frequencia} onChange={v=>s("frequencia",v)}/>
      </div>
      <div className="card">
        <div className="ql">Em quais momentos da rotina? <span className="r">*</span></div>
        <div className="hint">💡 <b>Para EI e CE/AEE:</b> A roda de leitura e a hora da história são ótimas oportunidades para inserir os gibis de forma lúdica, sem romper a rotina estruturada.</div>
        <CL items={MOMENTOS} val={f.momentos} onChange={v=>s("momentos",v)}/>
      </div>
      <div className="card">
        <div className="ql">Descreva brevemente sua sequência didática prevista:</div>
        <div className="hint">💡 <b>Exemplo:</b> Semana 1 — roda de leitura. Semana 2 — produção de HQ. Semana 3 — valores e diversidade. Semana 4 — exposição das produções.</div>
        <textarea value={f.sequencia} onChange={e=>s("sequencia",e.target.value)} placeholder="Descreva sua sequência aqui..."/>
      </div>

      <SH n="4" grad={GRADS.o} title="Recursos Necessários"/>
      <div className="card">
        <div className="ql">Quais recursos materiais você precisará? <span className="r">*</span></div>
        <div className="hint">💡 Liste todos os recursos que ainda não possui. A equipe de orientação pedagógica poderá antecipar providências com a direção.</div>
        <CL items={RECURSOS} val={f.recursos} onChange={v=>s("recursos",v)}/>
      </div>
      <div className="card">
        <div className="ql">Outros materiais não listados acima:</div>
        <textarea value={f.outroRecurso} onChange={e=>s("outroRecurso",e.target.value)} placeholder="Ex.: versão em Libras das histórias, aplicativo específico..."/>
      </div>
      <div className="card">
        <div className="ql">Precisará de apoio de outros profissionais?</div>
        <div className="hint">💡 O trabalho colaborativo é essencial nas turmas com alunos da educação especial.</div>
        <CL items={APOIOS_PROF} val={f.apoiosProfissionais} onChange={v=>s("apoiosProfissionais",v)}/>
      </div>

      <SH n="5" grad={GRADS.p} title="Inclusão e Adaptações Pedagógicas"/>
      <div className="card">
        <div className="ql">Você possui estratégias para a realização das atividades dos alunos com deficiência da sua turma? <span className="r">*</span></div>
        <RG items={["Sim, e já tenho adaptações previstas","Sim, mas ainda preciso pensar nas adaptações — gostaria de apoio","Não, mas quero tornar as atividades mais inclusivas","Não se aplica à minha turma"]} val={f.paee} onChange={v=>s("paee",v)}/>
      </div>
      <div className="card">
        <div className="ql">Estratégias de adaptação e inclusão que pretende utilizar: <span className="r">*</span></div>
        <div className="hint">💡 Para TEA: rotinas visuais com personagens. Para DI: sequenciamento de quadrinhos. Para deficiência visual: material tátil e descrições ricas.</div>
        <CL items={ADAPTACOES} val={f.adaptacoes} onChange={v=>s("adaptacoes",v)}/>
      </div>
      <div className="card">
        <div className="ql">Necessidade específica de algum aluno que gostaria de contemplar:</div>
        <div className="hint">⚠️ Não é necessário identificar o aluno pelo nome — descreva apenas a necessidade pedagógica.</div>
        <textarea value={f.necessidadeEspecifica} onChange={e=>s("necessidadeEspecifica",e.target.value)} placeholder="Ex.: aluno não-verbal que usa CAA e gostaria de criar pranchas com os personagens..."/>
      </div>

      <SH n="6" grad={GRADS.y} title="Expectativas e Apoios"/>
      <div className="card">
        <div className="ql">Nível de confiança para usar gibis como ferramenta pedagógica: <span className="r">*</span></div>
        <div className="hint">1 = Ainda tenho muitas dúvidas &nbsp;|&nbsp; 5 = Me sinto totalmente preparado(a)</div>
        <div className="stars">
          {[1,2,3,4,5].map(n=>(
            <button key={n} className={`sb${f.confianca===String(n)?" on":""}`} onClick={()=>s("confianca",String(n))}>{n}</button>
          ))}
        </div>
      </div>
      <div className="card">
        <div className="ql">Que tipo de apoio ou formação deseja da equipe de orientação pedagógica?</div>
        <CL items={FORMACOES} val={f.formacoes} onChange={v=>s("formacoes",v)}/>
      </div>
      <div className="card">
        <div className="ql">Observações, sugestões ou ideias sobre o projeto:</div>
        <div className="hint">💡 Compartilhe ideias criativas, experiências com sua turma ou qualquer sugestão para a equipe de orientação pedagógica.</div>
        <textarea value={f.observacoes} onChange={e=>s("observacoes",e.target.value)} placeholder="Suas ideias são muito bem-vindas..." style={{minHeight:88}}/>
      </div>
      <button className="btn-send" onClick={submit}>📨 Enviar Planejamento</button>
    </div>
  );
}

function Painel({respostas,onDelete}){
  const [busca,setBusca]=useState("");
  const [fSeg,setFSeg]=useState("");
  const [fBim,setFBim]=useState("");
  const [open,setOpen]=useState(null);
  const [auth,setAuth]=useState(false);
  const [senha,setSenha]=useState("");
  const [erroSenha,setErroSenha]=useState(false);

  const SENHA="orientacao2025";

  if(!auth) return(
    <div className="wrap">
      <div className="senha-box">
        <div style={{fontSize:"2.5rem",marginBottom:10}}>🔒</div>
        <h2>Acesso Restrito</h2>
        <p>Esta área é exclusiva para a equipe de orientação pedagógica. Digite a senha para continuar.</p>
        <input type="password" value={senha} onChange={e=>setSenha(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&(senha===SENHA?setAuth(true):setErroSenha(true))}
          placeholder="Digite a senha..." style={{marginBottom:4}}/>
        {erroSenha&&<div style={{color:RD,fontSize:".8rem",marginTop:4}}>⚠️ Senha incorreta. Tente novamente.</div>}
        <button className="btn-senha" onClick={()=>senha===SENHA?setAuth(true):setErroSenha(true)}>Entrar</button>
      </div>
    </div>
  );

  const fil=respostas.filter(r=>
    r.nome.toLowerCase().includes(busca.toLowerCase())&&
    (fSeg?r.segmentos.some(s=>s.includes(fSeg)):true)&&
    (fBim?r.bimestre===fBim:true)
  );

  const topAtiv=Object.entries(
    respostas.flatMap(r=>r.atividades).reduce((a,x)=>({...a,[x]:(a[x]||0)+1}),{})
  ).sort((a,b)=>b[1]-a[1]).slice(0,3);

  const topRec=Object.entries(
    respostas.flatMap(r=>r.recursos).reduce((a,x)=>({...a,[x]:(a[x]||0)+1}),{})
  ).sort((a,b)=>b[1]-a[1]).slice(0,3);

  const sc={ei:0,ef1:0,aei:0,ce:0};
  respostas.forEach(r=>{
    if(r.segmentos.some(s=>s.includes("Infantil"))) sc.ei++;
    if(r.segmentos.some(s=>s.includes("Fundamental"))) sc.ef1++;
    if(r.segmentos.some(s=>s.includes("AEE"))) sc.aei++;
    if(r.segmentos.some(s=>s.includes("Especial"))) sc.ce++;
  });

  return(
    <div className="wrap">
      <div className="aviso-painel">
        ⚠️ <b>Atenção:</b> As respostas ficam salvas no navegador de quem acessa esta aba. Para que todas as respostas dos professores fiquem centralizadas, acesse sempre o painel <b>no mesmo dispositivo e navegador</b> onde o link foi aberto originalmente — ou use um serviço de banco de dados externo (entre em contato para configurar).
      </div>
      <div className="pt">
        <h2>📊 Painel de Orientação Pedagógica</h2>
        <span style={{fontSize:".78rem",color:"#5C5C7A"}}>{respostas.length} resposta{respostas.length!==1?"s":""}</span>
      </div>
      <div className="stats">
        <div className="stat"><div className="n">{respostas.length}</div><div className="l">Respostas</div></div>
        <div className="stat"><div className="n" style={{color:OR}}>{sc.ei}</div><div className="l">Ed. Infantil</div></div>
        <div className="stat"><div className="n" style={{color:BL}}>{sc.ef1}</div><div className="l">EF 1.º Seg.</div></div>
        <div className="stat"><div className="n" style={{color:PU}}>{sc.aei}</div><div className="l">AEI</div></div>
        <div className="stat"><div className="n" style={{color:GR}}>{sc.ce}</div><div className="l">Cl. Especial</div></div>
      </div>
      {respostas.length>0&&(
        <div className="top2">
          <div className="card">
            <div className="tk" style={{color:BL}}>🏆 Atividades mais planejadas</div>
            {topAtiv.map(([a,n])=><div key={a} className="tr"><span>{a.slice(0,32)}{a.length>32?"…":""}</span><b>{n}×</b></div>)}
          </div>
          <div className="card">
            <div className="tk" style={{color:OR}}>📦 Recursos mais solicitados</div>
            {topRec.map(([r,n])=><div key={r} className="tr"><span>{r.slice(0,32)}{r.length>32?"…":""}</span><b>{n}×</b></div>)}
          </div>
        </div>
      )}
      <div className="filters">
        <input type="text" placeholder="🔍 Buscar por nome..." value={busca} onChange={e=>setBusca(e.target.value)}/>
        <select value={fSeg} onChange={e=>setFSeg(e.target.value)}>
          <option value="">Todos os segmentos</option>
          <option value="Infantil">Ed. Infantil</option>
          <option value="Fundamental">EF 1.º Seg.</option>
          <option value="AEE">AEE</option>
          <option value="Especial">Cl. Especial</option>
        </select>
        <select value={fBim} onChange={e=>setFBim(e.target.value)}>
          <option value="">Todos os bimestres</option>
          <option>1.º Bimestre</option>
          <option>2.º Bimestre</option>
          <option>3.º Bimestre</option>
          <option>4.º Bimestre</option>
        </select>
      </div>
      {fil.length===0?(
        <div className="empty">
          <div className="ico">{respostas.length===0?"📭":"🔍"}</div>
          <p>{respostas.length===0?"Nenhum planejamento recebido ainda.":"Nenhuma resposta encontrada com os filtros."}</p>
        </div>
      ):fil.map(r=>(
        <div key={r.id} className="rc">
          <div className="rc-head">
            <div>
              <div className="rc-name">👤 {r.nome}</div>
              <div className="rc-date">📅 {r.data} · {r.bimestre}</div>
              <div style={{marginTop:4}}>
                {r.segmentos.map(sg=><span key={sg} className="tag tb">{sg.includes("Infantil")?"🧸 EI":sg.includes("Fundamental")?"📖 EF1":sg.includes("AEE")?"🌟 AEE":"💛 CE"}</span>)}
              </div>
            </div>
            <button className="btn-del" onClick={()=>onDelete(r.id)}>🗑 Excluir</button>
          </div>
          <div className="rf"><div className="rl">Atividades e bimestres</div><div className="rv">{r.atividades.map(a=><span key={a} className="tag tg">{a}{r.atividadesBimestres&&r.atividadesBimestres[a]&&r.atividadesBimestres[a].length>0?" ("+r.atividadesBimestres[a].map(b=>b.replace(".º Bimestre","°B")).join(", ")+")":""}</span>)}</div></div>
          <div className="sep"/>
          <div className="rf"><div className="rl">Personagens</div><div className="rv">{r.personagens.map(p=><span key={p} className="tag to">{p}</span>)}</div></div>
          <div className="sep"/>
          <div className="rf"><div className="rl">Frequência</div><div className="rv">{r.frequencia}</div></div>
          <button className="acc-btn" onClick={()=>setOpen(open===r.id?null:r.id)}>
            {open===r.id?"▲ Ocultar detalhes":"▼ Ver todos os detalhes"}
          </button>
          {open===r.id&&(
            <div style={{marginTop:8}}>
              <div className="rf"><div className="rl">Momentos da rotina</div><div className="rv">{r.momentos.map(m=><span key={m} className="tag tb">{m}</span>)}</div></div>
              {r.sequencia&&<><div className="sep"/><div className="rf"><div className="rl">Sequência didática</div><div className="rv">{r.sequencia}</div></div></>}
              <div className="sep"/>
              <div className="rf"><div className="rl">Recursos necessários</div><div className="rv">{r.recursos.map(rc=><span key={rc} className="tag to">{rc}</span>)}</div></div>
              {r.outroRecurso&&<><div className="sep"/><div className="rf"><div className="rl">Outros recursos</div><div className="rv">{r.outroRecurso}</div></div></>}
              {r.apoiosProfissionais.length>0&&<><div className="sep"/><div className="rf"><div className="rl">Apoios profissionais</div><div className="rv">{r.apoiosProfissionais.map(a=><span key={a} className="tag tp">{a}</span>)}</div></div></>}
              <div className="sep"/>
              <div className="rf"><div className="rl">Estratégias para alunos com deficiência</div><div className="rv">{r.paee}</div></div>
              <div className="sep"/>
              <div className="rf"><div className="rl">Adaptações inclusivas</div><div className="rv">{r.adaptacoes.map(a=><span key={a} className="tag tp">{a}</span>)}</div></div>
              {r.necessidadeEspecifica&&<><div className="sep"/><div className="rf"><div className="rl">Necessidade específica</div><div className="rv">{r.necessidadeEspecifica}</div></div></>}
              <div className="sep"/>
              <div className="rf"><div className="rl">Nível de confiança</div><div className="rv">{"⭐".repeat(Number(r.confianca))} ({r.confianca}/5)</div></div>
              {r.formacoes.length>0&&<><div className="sep"/><div className="rf"><div className="rl">Formações desejadas</div><div className="rv">{r.formacoes.map(f=><span key={f} className="tag tg">{f}</span>)}</div></div></>}
              {r.observacoes&&<><div className="sep"/><div className="rf"><div className="rl">Observações</div><div className="rv">{r.observacoes}</div></div></>}
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

function App(){
  const [tab,setTab]=useState("form");
  const [respostas,setRespostas]=useState([]);

  useEffect(()=>{
    try{
      const salvo=localStorage.getItem(STORAGE_KEY);
      if(salvo) setRespostas(JSON.parse(salvo));
    }catch(_){}
  },[]);

  const save=(entry)=>{
    const next=[entry,...respostas];
    setRespostas(next);
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(next));}catch(_){}
  };

  const del=(id)=>{
    const next=respostas.filter(r=>r.id!==id);
    setRespostas(next);
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(next));}catch(_){}
  };

  return(
    <>
      <style>{css}</style>
      <div className="hero">
        <div className="badge">📚 Projeto Pedagógico Anual 2026</div>
        <h1>90 Anos de <em>Maurício de Sousa</em><br/>Gibis como Ferramenta de Aprendizagem e Inclusão</h1>
        <p>🏫 E. M. Regina Celi da Silva Cerdeira — Planejamento Anual</p>
      </div>
      <div className="tabs">
        <button className={`tab${tab==="form"?" on":""}`} onClick={()=>setTab("form")}>📝 Formulário do Professor</button>
        <button className={`tab${tab==="painel"?" on":""}`} onClick={()=>setTab("painel")}>📊 Painel de Orientação {respostas.length>0&&`(${respostas.length})`}</button>
      </div>
      {tab==="form"?<Formulario onSave={save}/>:<Painel respostas={respostas} onDelete={del}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
